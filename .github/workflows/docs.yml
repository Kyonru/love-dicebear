name: Documentation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements-docs.txt
      - run: python scripts/prepare_docs.py
      - run: zensical build --clean --strict
      - run: python tests/docs/check_reference.py
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --prefix tests/docs --ignore-scripts
      - run: tests/docs/node_modules/.bin/playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y lua5.4
      - run: npm test --prefix tests/docs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: documentation-previews
          path: test-output/docs
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v4
