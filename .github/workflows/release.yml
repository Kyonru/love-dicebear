name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/test.yml

  package:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Validate version and package library
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/package_release.py --version "$RELEASE_TAG"
      - uses: actions/upload-artifact@v4
        with:
          name: release-library
          path: |
            dist/*.zip
            dist/SHA256SUMS
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-library
          path: dist
      - name: Verify downloaded archive
        working-directory: dist
        run: sha256sum --check SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" dist/*.zip dist/SHA256SUMS \
            --verify-tag --generate-notes --notes-file packaging/RELEASE.md \
            --title "love-dicebear $RELEASE_TAG" "${flags[@]}"
