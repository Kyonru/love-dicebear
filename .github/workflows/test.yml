name: Test
on: [push, pull_request]
jobs:
  lua:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        lua: [lua5.1, lua5.4, luajit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y lua5.1 lua5.4 luajit
      - run: npm ci --ignore-scripts
      - run: npm run test:dev
      - run: ${{ matrix.lua }} tests/run.lua
      - run: ${{ matrix.lua }} tests/adapter.lua
      - run: ${{ matrix.lua }} tests/save.lua
      - run: npm test
        env:
          LUA: ${{ matrix.lua }}
      - run: python3 scripts/import_style.py && git diff --exit-code -- love_dicebear/styles/bottts.lua
