name: Test
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:
jobs:
  lua:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        lua: [lua5.1, lua5.4, luajit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y lua5.1 lua5.4 luajit curl
      - run: npm ci --ignore-scripts
      - run: npm run test:dev
      - run: ${{ matrix.lua }} tests/run.lua
      - run: ${{ matrix.lua }} tests/adapter.lua
      - run: ${{ matrix.lua }} tests/save.lua
      - run: ${{ matrix.lua }} tests/http_url.lua
      - run: ${{ matrix.lua }} tests/http.lua
      - run: ${{ matrix.lua }} tests/http_worker.lua
      - run: npm test
        env:
          LUA: ${{ matrix.lua }}
      - run: python3 scripts/import_style.py && git diff --exit-code -- love_dicebear/styles STYLES.md

  release-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: sudo apt-get update && sudo apt-get install -y lua5.4
      - run: python tests/release.py
