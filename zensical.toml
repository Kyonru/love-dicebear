[project]
site_name = "love-dicebear"
site_description = "Customizable DiceBear avatars for Lua and LÖVE: local SVG generation, your choice of renderer, and HTTP PNGs."
site_url = "https://kyonru.github.io/love-dicebear/"
repo_url = "https://github.com/Kyonru/love-dicebear"
repo_name = "Kyonru/love-dicebear"
docs_dir = "docs"
site_dir = "site"
not_in_nav = "styles/*.md"
extra_css = ["assets/stylesheets/docs.css"]
extra_javascript = ["assets/javascripts/sidebar.js"]
nav = [
  { "Overview" = "index.md" },
  { "Guides" = [
    { "Getting started" = "getting-started.md" },
    { "Build an editor" = "customization.md" },
    { "Bring your own renderer" = "renderers.md" },
    { "Render with ThorVG" = "thorvg.md" },
    { "HTTP and caching" = "http.md" },
  ] },
  { "API reference" = [
    { "Core API" = "api/core.md" },
    { "Avatar options" = "options.md" },
    { "ThorVG adapter" = "api/thorvg.md" },
    { "HTTP API" = "api/http.md" },
  ] },
  { "Catalog" = [
    { "Styles and their options" = "styles.md" },
    { "Licenses and notices" = "third-party.md" },
  ] },
  { "Project" = [
    { "Development" = "development.md" },
    { "Documentation" = "documentation.md" },
  ] },
]

[project.theme]
features = [
  "navigation.instant", "navigation.instant.progress",
  "navigation.sections", "navigation.expand", "navigation.footer",
  "content.code.copy", "toc.follow",
]

[project.theme.icon]
logo = "lucide/dices"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"
